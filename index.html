<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2589</title>
    <style>
        
        body {
            background-color: #0b0b0b;
            color: #888888;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        .status {
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: #444444;
        }
        input[type="text"] {
            background-color: #111111;
            border: 1px solid #333333;
            color: #ffffff;
            padding: 10px 15px;
            font-family: inherit;
            font-size: 14px;
            text-align: center;
            outline: none;
            letter-spacing: 1px;
            width: 200px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #555555;
        }
        button {
            background-color: transparent;
            border: 1px solid #333333;
            color: #888888;

            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            margin-left: 10px;

<body>

<!--

  CRITICAL_ERROR: NULL_POINTER_GRAVE
  
  * Note: The key is where everything is gone.
  =========================================
-->

<div class="container">
    <form id="gateForm" onsubmit="checkPassword(event)">
        <input type="text" id="passkey" placeholder="PASSWORD" autocomplete="off">
        <button type="submit">ACCESS</button>
    </form>
</div>

<script>
    function checkPassword(event) {
        event.preventDefault();
        const input = document.getElementById('passkey').value.trim().toUpperCase();
        
        if (btoa(input) === 'TlVMTA==') {
    window.location.href = 'https://null-man-null.github.io/2589/next_stage/index.html';
        } else {
            
            document.getElementById('passkey').value = '';
            document.getElementById('passkey').placeholder = 'DENIED';
            setTimeout(() => {
                document.getElementById('passkey').placeholder = 'ENTER PASSKEY';
            }, 1000);
        }
    }
</script>

</body>
