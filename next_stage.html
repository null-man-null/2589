<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>next_stage</title>
    <style>

        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }


        .circle-btn {
            width: 90px;
            height: 90px;
            background-color: #000000;
            border: 2px solid #ffffff; 
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease;
            outline: none;
        }


        .icon {
            transition: all 0.2s ease;
        }


        .icon.play {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 15px 0 15px 25px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 6px;
        }


        .circle-btn:not(.playing):hover {
            background-color: #ffffff;
        }
        .circle-btn:not(.playing):hover .icon.play {
            border-color: transparent transparent transparent #000000;
        }



        .circle-btn.playing {
            background-color: #000000 !important; 
            cursor: pointer;
        }
        .icon.pause {
            width: 20px;
            height: 26px;
            border-left: 6px solid #ffffff;
            border-right: 6px solid #ffffff;
            box-sizing: border-box;
            margin-left: 0;
        }

        .circle-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <button class="circle-btn" id="coreButton">
        <div class="icon play" id="btnIcon"></div>
    </button>

    <audio id="audioTrack" src="4.m4a" preload="auto"></audio>

    <script>
        const coreButton = document.getElementById('coreButton');
        const btnIcon = document.getElementById('btnIcon');
        const audioTrack = document.getElementById('audioTrack');
        let isPlaying = false;

        coreButton.addEventListener('click', () => {
            if (!isPlaying) {
                audioTrack.play();
                coreButton.classList.add('playing');
                
        
                btnIcon.classList.remove('play');
                btnIcon.classList.add('pause');
                
                isPlaying = true;
            } else {
                audioTrack.pause();
                audioTrack.currentTime = 0;
                coreButton.classList.remove('playing');
                
        
                btnIcon.classList.remove('pause');
                btnIcon.classList.add('play');
                
                isPlaying = false;
            }
        });


        audioTrack.addEventListener('ended', () => {
            coreButton.classList.remove('playing');
            btnIcon.classList.remove('pause');
            btnIcon.classList.add('play');
            isPlaying = false;
        });
    </script>
</body>
</html>
