<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAYER_03</title>
    <style>
        /* 感情も動きも一切排除した、静寂のモノクロ */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000; /* 完全な漆黒 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 中央に浮かぶ丸型のボタン */
        .circle-btn {
            width: 90px;
            height: 90px;
            background-color: #000000;
            border: 2px solid #ffffff; 
            border-radius: 50%; /* 完璧な丸型 */
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease;
            outline: none;
        }

        /* ボタンの中の「マーク」の共通ベース */
        .icon {
            transition: all 0.2s ease;
        }

        /* --- 1. 通常時：再生マーク（白い三角） --- */
        .icon.play {
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 15px 0 15px 25px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 6px; /* 三角形の中央の錯視調整 */
        }

        /* ホバー時に三角の色を黒に反転（再生中ではない時のみ） */
        .circle-btn:not(.playing):hover {
            background-color: #ffffff;
        }
        .circle-btn:not(.playing):hover .icon.play {
            border-color: transparent transparent transparent #000000;
        }

        /* --- 2. 再生中：一時停止マーク（白い二本線） --- */
        /* 再生中（playing）は、マウスが乗ろうが離れようが、背景は黒、線は白で完全固定 */
        .circle-btn.playing {
            background-color: #000000 !important; 
            cursor: pointer;
        }
        .icon.pause {
            width: 20px;
            height: 26px;
            border-left: 6px solid #ffffff;
            border-right: 6px solid #ffffff;
            box-sizing: border-box;
            margin-left: 0;
        }

        .circle-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <button class="circle-btn" id="coreButton">
        <div class="icon play" id="btnIcon"></div>
    </button>

    <audio id="audioTrack" src="4.m4a" preload="auto"></audio>

    <script>
        const coreButton = document.getElementById('coreButton');
        const btnIcon = document.getElementById('btnIcon');
        const audioTrack = document.getElementById('audioTrack');
        let isPlaying = false;

        coreButton.addEventListener('click', () => {
            if (!isPlaying) {
                audioTrack.play();
                coreButton.classList.add('playing');
                
                // マークを確実に「一時停止（二本線）」に切り替える
                btnIcon.classList.remove('play');
                btnIcon.classList.add('pause');
                
                isPlaying = true;
            } else {
                audioTrack.pause();
                audioTrack.currentTime = 0; // 最初に戻す
                coreButton.classList.remove('playing');
                
                // マークを「再生（三角）」に戻す
                btnIcon.classList.remove('pause');
                btnIcon.classList.add('play');
                
                isPlaying = false;
            }
        });

        // 音声が最後まで流れ終わったら自動的に最初の状態（三角）に戻る
        audioTrack.addEventListener('ended', () => {
            coreButton.classList.remove('playing');
            btnIcon.classList.remove('pause');
            btnIcon.classList.add('play');
            isPlaying = false;
        });
    </script>
</body>
</html>
