<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAYER_03</title>
    <style>
        /* 感情を完全に削ぎ落としたモノクロの世界 */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000; /* 完全な漆黒 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 中央に浮かぶ丸型の再生ボタン */
        .circle-btn {
            width: 90px;
            height: 90px;
            background-color: #000000;
            border: 2px solid #ffffff; /* 白と黒のモノクロ */
            border-radius: 50%; /* 完璧な丸型 */
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease;
            outline: none;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        /* ボタンの中の「三角マーク（▶）」 */
        .icon {
            width: 0;
            height: 0;
            border-style: solid;
            /* 右向きの綺麗な三角形を作る（少し右にずらして中央の錯視を調整） */
            border-width: 15px 0 15px 25px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 6px; 
            transition: all 0.4s ease;
        }

        /* マウスを乗せた（タップした）ときの反応 */
        .circle-btn:hover {
            background-color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.7);
        }
        /* ホバー時に三角マークの色を黒に反転 */
        .circle-btn:hover .icon {
            border-color: transparent transparent transparent #000000;
        }

        .circle-btn:active {
            transform: scale(0.92);
        }

        /* 再生中（isPlayingクラスがついたとき）の演出 */
        /* 三角（▶）から一時停止の「縦線二本（■風）」に変形させます */
        .circle-btn.playing .icon {
            border-style: double;
            border-width: 0px 0px 0px 22px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 0;
            height: 26px;
        }
        /* 再生中にボタン自体を少し怪しく明滅させる */
        .circle-btn.playing {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(255, 255, 255, 0.4); }
            50% { box-shadow: 0 0 30px rgba(255, 255, 255, 0.8); }
            100% { box-shadow: 0 0 15px rgba(255, 255, 255, 0.4); }
        }
    </style>
</head>
<body>

    <button class="circle-btn" id="coreButton">
        <div class="icon" id="btnIcon"></div>
    </button>

    <audio id="audioTrack" src="4.m4a" preload="auto"></audio>

    <script>
        const coreButton = document.getElementById('coreButton');
        const audioTrack = document.getElementById('audioTrack');
        let isPlaying = false;

        coreButton.addEventListener('click', () => {
            if (!isPlaying) {
                audioTrack.play();
                coreButton.classList.add('playing'); // 再生中モード（縦線に変化）
                isPlaying = true;
            } else {
                audioTrack.pause();
                audioTrack.currentTime = 0; // 停止したら最初に戻す
                coreButton.classList.remove('playing'); // 再生マーク（三角）に戻す
                isPlaying = false;
            }
        });

        // 音声が最後まで流れ終わったら自動的に最初の状態に戻る
        audioTrack.addEventListener('ended', () => {
            coreButton.classList.remove('playing');
            isPlaying = false;
        });
    </script>
</body>
</html>
